<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title or "My Notifications" }}</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .box {
            max-width: 720px;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .title {
            margin: 0;
            color: #1565C0;
        }

        .home-btn {
            text-decoration: none;
            background: #1565C0;
            color: #fff;
            padding: 8px 14px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 700;
        }

        .note {
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .note:last-child {
            border-bottom: none;
        }

        .date {
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>
<body>
<div class="box">
    <div class="top-row">
            <h2 class="title">{{ page_title or "Notifications" }}</h2>
            <a class="home-btn" href="{{ back_url or '/home' }}">Back to Home</a>
    </div>

    {% for n in notifications %}
        <div class="note">
            <p>{{ n.message }}</p>
            <div class="date">{{ n.created_at }}</div>
        </div>
    {% else %}
        <p>No notifications</p>
    {% endfor %}
</div>

<script src="{{ url_for('static', filename='user_notifications.js') }}"></script>
</body>
</html>
